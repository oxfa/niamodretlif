name: Pipeline Cleanup
run-name: pipeline cleanup / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-cleanup
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEEP_COUNT: "2"
      CACHE_PREFIXES: |
        domain-pipeline-dns-sqlite-block-
        domain-pipeline-dns-sqlite-direct-
      WORKFLOW_HISTORY_FILES: |
        pipeline-block.yml
        pipeline-direct.yml
        pipeline-cleanup.yml
    steps:
      - name: Delete stale pipeline-run sqlite caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/caches"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "${temp_dir}"' EXIT

          all_caches_path="${temp_dir}/all-caches.json"
          printf '[]\n' > "${all_caches_path}"

          page=1
          while :; do
            response_path="${temp_dir}/page-${page}.json"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_root}?per_page=100&page=${page}" \
              > "${response_path}"

            page_count="$(jq '.actions_caches | length' "${response_path}")"
            merged_path="${temp_dir}/merged-${page}.json"
            jq -s 'add' "${all_caches_path}" <(jq '.actions_caches' "${response_path}") \
              > "${merged_path}"
            mv "${merged_path}" "${all_caches_path}"

            if [ "${page_count}" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Loaded $(jq 'length' "${all_caches_path}") cache entries across ${page} page(s)."

          total_deleted=0
          while IFS= read -r prefix; do
            [ -n "${prefix}" ] || continue

            prefix_count="$(
              jq --arg prefix "${prefix}" \
                'map(select(.key | startswith($prefix))) | length' \
                "${all_caches_path}"
            )"
            echo "Found ${prefix_count} cache entries for prefix=${prefix}"

            prefix_deleted=0
            while IFS= read -r encoded_row; do
              [ -n "${encoded_row}" ] || continue

              row_json="$(printf '%s' "${encoded_row}" | base64 --decode)"
              cache_id="$(jq -r '.id' <<< "${row_json}")"
              cache_key="$(jq -r '.key' <<< "${row_json}")"
              created_at="$(jq -r '.created_at' <<< "${row_json}")"
              last_accessed_at="$(jq -r '.last_accessed_at' <<< "${row_json}")"
              size_in_bytes="$(jq -r '.size_in_bytes' <<< "${row_json}")"

              echo \
                "Deleting cache id=${cache_id} key=${cache_key} created_at=${created_at} last_accessed_at=${last_accessed_at} size_in_bytes=${size_in_bytes}"
              curl -fsSL \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_root}/${cache_id}"

              prefix_deleted=$((prefix_deleted + 1))
              total_deleted=$((total_deleted + 1))
            done < <(
              jq -r --arg prefix "${prefix}" --argjson keep "${KEEP_COUNT}" '
                map(select(.key | startswith($prefix)))
                | sort_by(.created_at)
                | reverse
                | .[$keep:]
                | .[]
                | @base64
              ' "${all_caches_path}"
            )

            echo "Deleted ${prefix_deleted} stale caches for prefix=${prefix}"
          done <<< "${CACHE_PREFIXES}"

          echo "Deleted ${total_deleted} stale pipeline-run sqlite caches in total."

      - name: Delete stale pipeline workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "${temp_dir}"' EXIT

          total_deleted=0
          while IFS= read -r workflow_file; do
            [ -n "${workflow_file}" ] || continue

            workflow_runs_path="${temp_dir}/${workflow_file}-runs.json"
            printf '[]\n' > "${workflow_runs_path}"

            page=1
            while :; do
              response_path="${temp_dir}/${workflow_file}-page-${page}.json"
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_root}/workflows/${workflow_file}/runs?per_page=100&page=${page}" \
                > "${response_path}"

              page_count="$(jq '.workflow_runs | length' "${response_path}")"
              merged_path="${temp_dir}/${workflow_file}-merged-${page}.json"
              jq -s 'add' "${workflow_runs_path}" <(jq '.workflow_runs' "${response_path}") \
                > "${merged_path}"
              mv "${merged_path}" "${workflow_runs_path}"

              if [ "${page_count}" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done

            workflow_run_count="$(jq 'length' "${workflow_runs_path}")"
            echo "Found ${workflow_run_count} workflow runs for workflow=${workflow_file}"

            workflow_deleted=0
            while IFS= read -r encoded_row; do
              [ -n "${encoded_row}" ] || continue

              row_json="$(printf '%s' "${encoded_row}" | base64 --decode)"
              run_id="$(jq -r '.id' <<< "${row_json}")"
              run_number="$(jq -r '.run_number' <<< "${row_json}")"
              status="$(jq -r '.status' <<< "${row_json}")"
              conclusion="$(jq -r '.conclusion' <<< "${row_json}")"
              created_at="$(jq -r '.created_at' <<< "${row_json}")"
              html_url="$(jq -r '.html_url' <<< "${row_json}")"

              echo \
                "Deleting workflow run id=${run_id} run_number=${run_number} workflow=${workflow_file} status=${status} conclusion=${conclusion} created_at=${created_at} url=${html_url}"
              curl -fsSL \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_root}/runs/${run_id}"

              workflow_deleted=$((workflow_deleted + 1))
              total_deleted=$((total_deleted + 1))
            done < <(
              jq -r --argjson keep "${KEEP_COUNT}" '
                sort_by(.created_at)
                | reverse
                | .[$keep:]
                | .[]
                | @base64
              ' "${workflow_runs_path}"
            )

            echo "Deleted ${workflow_deleted} stale workflow runs for workflow=${workflow_file}"
          done <<< "${WORKFLOW_HISTORY_FILES}"

          echo "Deleted ${total_deleted} stale pipeline workflow runs in total."
