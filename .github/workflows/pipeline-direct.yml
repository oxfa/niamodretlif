name: Pipeline Direct
run-name: pipeline direct / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-direct
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config manual files:
# - input/manual_filter_pass/direct.txt
# - input/manual_filter_out/direct.txt
# - input/manual_add/direct.txt
# manual_filter_pass and manual_add require delegation before routing to
# filtered, except source-matched public suffix manual_filter_pass entries,
# which route to filtered during prepare because there is no registrable domain
# to query. manual_filter_out bypasses delegation, host resolution, and ip location and
# routes to review.
jobs:
  batch:
    uses: ./.github/workflows/_pipeline-run-batch.yml
    with:
      config_name: direct
      config_path: config/direct.yaml
      # Stage-specific resolver weights for enabled DNS stages control
      # first-attempt traffic share inside each worker. max_parallel_workers
      # controls only GitHub matrix concurrency. The repository variable
      # PIPELINE_RUN_MAX_PARALLEL_WORKERS overrides this config-specific default.
      worker_count: 18
      max_parallel_workers_default: "18"
    secrets: inherit
