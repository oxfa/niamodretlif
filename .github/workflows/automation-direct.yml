name: Automation Direct
run-name: automation direct / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: automation-direct
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config manual files:
# - input/manual_filter_pass/direct.txt
# - input/manual_filter_out/direct.txt
# - input/manual_add/direct.txt
# manual_filter_pass and manual_add still require delegation before filtered
# output; manual_filter_out bypasses DNS/geo and writes review rows.
jobs:
  batch:
    uses: ./.github/workflows/_automation-batch.yml
    with:
      config_name: direct
      config_path: config/direct.yaml
      # Stage-specific resolver entries control live traffic share inside each
      # worker when weights are present. DNS query rate limits are enforced per
      # provider across the effective parallel workers. The repository variable
      # AUTOMATION_MAX_PARALLEL_WORKERS overrides this config-specific default.
      worker_count: 18
      max_parallel_workers_default: "6"
    secrets: inherit
