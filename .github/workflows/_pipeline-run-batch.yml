name: Trusted Pipeline Run Batch

on:
  workflow_call:
    inputs:
      config_name:
        required: true
        type: string
      config_path:
        required: true
        type: string
      worker_count:
        required: true
        type: number
      max_parallel_workers_default:
        required: false
        type: string
        default: ""
      worker_log_level:
        required: false
        type: string
        default: debug
      aggregate_log_level:
        required: false
        type: string
        default: debug

permissions: {}

jobs:
  prepare_run:
    name: Validate settings and prepare batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      max_parallel_workers: ${{ steps.validate.outputs.max_parallel_workers }}
      worker_ids_json: ${{ steps.validate.outputs.worker_ids_json }}
      worker_runtime_budget_seconds: ${{ steps.validate.outputs.worker_runtime_budget_seconds }}
      target_branch: ${{ steps.validate.outputs.target_branch }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      batch_id: ${{ steps.batch.outputs.batch_id }}
    env:
      PIPELINE_RUN_MAX_PARALLEL_WORKERS: ${{ vars.PIPELINE_RUN_MAX_PARALLEL_WORKERS }}
      PIPELINE_PUBLISH_TARGET_BRANCH: ${{ vars.PIPELINE_PUBLISH_TARGET_BRANCH }}
      PIPELINE_MAX_RUNTIME_SECONDS: ${{ vars.PIPELINE_MAX_RUNTIME_SECONDS }}
      IP_LOCATION_IPINFO_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - name: Identify preparation batch
        id: identity
        run: echo "batch_id=batch-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: src/pipeline_run.py
      - name: Validate settings
        id: validate
        run: |
          set -eo pipefail
          {
            echo "=== Validate settings ==="
            ./src/pipeline_run.py validate-run-settings \
              --worker-count "${{ inputs.worker_count }}" \
              --max-parallel-workers "${PIPELINE_RUN_MAX_PARALLEL_WORKERS:-}" \
              --max-parallel-workers-default "${{ inputs.max_parallel_workers_default }}" \
              --worker-runtime-seconds "${PIPELINE_MAX_RUNTIME_SECONDS:-}" \
              | tee settings.json
          } 2>&1 | tee validate-settings.log
          echo "max_parallel_workers=$(jq -r '.max_parallel_workers' settings.json)" >> "$GITHUB_OUTPUT"
          echo "worker_ids_json=$(jq -c '.worker_ids' settings.json)" >> "$GITHUB_OUTPUT"
          echo "worker_runtime_budget_seconds=$(jq -r '.worker_runtime_budget_seconds' settings.json)" >> "$GITHUB_OUTPUT"
          # Default publishes go to main; the repository variable can override it.
          echo "target_branch=${PIPELINE_PUBLISH_TARGET_BRANCH:-main}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build committed batch state
        id: batch
        run: |
          set -eo pipefail
          {
            echo "=== Build committed batch state ==="
            ./src/pipeline_run.py prepare-batch \
              --source-root . \
              --state-root . \
              --config "${{ inputs.config_path }}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --worker-count "${{ inputs.worker_count }}" \
              | tee batch.json
          } 2>&1 | tee prepare-batch.log
          test "$(jq -r '.batch_id' batch.json)" = "${{ steps.identity.outputs.batch_id }}"
          echo "batch_id=$(jq -r '.batch_id' batch.json)" >> "$GITHUB_OUTPUT"
      - name: Stage worker input artifacts
        run: |
          set -eo pipefail
          mkdir -p .tmp
          ./src/pipeline_run.py handoff-stage-worker-inputs \
            --state-root . \
            --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --worker-ids-json '${{ steps.validate.outputs.worker_ids_json }}' \
            --destination .tmp/worker-inputs
      - name: Validate staged worker inputs
        run: |
          ./src/pipeline_run.py handoff-validate-worker-inputs \
            --state-root . --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --worker-ids-json '${{ steps.validate.outputs.worker_ids_json }}' \
            --destination .tmp/worker-inputs
      - name: Upload combined worker input artifact
        uses: actions/upload-artifact@v7
        with:
          name: workflow-internal-combined-worker-inputs-${{ steps.batch.outputs.batch_id }}
          path: .tmp/worker-inputs
          include-hidden-files: true
          if-no-files-found: error
      - name: Stage prepared batch artifact
        if: ${{ always() && steps.identity.outcome == 'success' }}
        env:
          PREPARE_SUCCESS: ${{ steps.batch.outcome == 'success' }}
        run: |
          set -eo pipefail
          args=()
          if [ "$PREPARE_SUCCESS" = true ]; then args+=(--require-runtime); fi
          ./src/pipeline_run.py handoff-stage \
            --state-root . --handoff prepare-aggregate \
            --batch-id "${{ steps.identity.outputs.batch_id }}" \
            --destination .tmp/prepared_batch "${args[@]}"
      - name: Upload prepared batch artifact
        if: ${{ always() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workflow-internal-prepared-batch-${{ steps.identity.outputs.batch_id }}
          path: .tmp/prepared_batch
          include-hidden-files: true
          if-no-files-found: ignore

  run_workers:
    name: Run workers
    needs:
      - prepare_run
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare_run.outputs.max_parallel_workers) }}
      matrix:
        worker_id: ${{ fromJSON(needs.prepare_run.outputs.worker_ids_json) }}
    env:
      IP_LOCATION_IPINFO_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        id: checkout_worker
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        id: setup_uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: src/pipeline_run.py
      # Prefer the prior attempt from the same workflow run when a rerun needs
      # to resume DNS-only cache progress, then fall back to the broader
      # config-wide lineage. Later diagnostics log GitHub restore output,
      # visible cache candidates, local DB file state, and sqlite usability
      # separately; visible candidates do not prove restore eligibility.
      - name: Restore baseline cache
        id: restore_worker_baseline_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-
            domain-pipeline-runtime-cache-${{ inputs.config_name }}-
      - name: Log worker baseline cache restore
        id: log_worker_baseline_cache
        run: |
          set -eo pipefail
          worker_cache_log_path="$(./src/pipeline_run.py handoff-worker-diagnostic-path --state-root . --batch-id "${{ needs.prepare_run.outputs.batch_id }}" --worker-id "${{ matrix.worker_id }}" --kind cache-log)"
          mkdir -p "$(dirname "${worker_cache_log_path}")"
          cache_hit="${{ steps.restore_worker_baseline_cache.outputs.cache-hit }}"
          if [ -z "${cache_hit}" ]; then
            restore_result="miss"
          elif [ "${cache_hit}" = "true" ]; then
            restore_result="exact"
          else
            restore_result="fallback"
          fi
          mkdir -p .workflow_state/runtime/cache
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          summary_parts=()
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "worker baseline cache restore config=${{ inputs.config_name }} run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache primary_key=domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restore_prefixes=domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-,domain-pipeline-runtime-cache-${{ inputs.config_name }}-" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache cache-hit=${cache_hit}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restore_result=${restore_result}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restored_paths=${summary}" | tee -a "${worker_cache_log_path}"
          ls -la .workflow_state/runtime/cache | tee -a "${worker_cache_log_path}"
      - name: Inspect worker cache candidates
        id: inspect_worker_cache_candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          worker_cache_log_path="$(./src/pipeline_run.py handoff-worker-diagnostic-path --state-root . --batch-id "${{ needs.prepare_run.outputs.batch_id }}" --worker-id "${{ matrix.worker_id }}" --kind cache-log)"
          mkdir -p "$(dirname "${worker_cache_log_path}")"
          cache_hit="${{ steps.restore_worker_baseline_cache.outputs.cache-hit }}"
          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/caches"
          key_prefix="domain-pipeline-runtime-cache-${{ inputs.config_name }}-"
          response_path="$(mktemp)"
          trap 'rm -f "${response_path}"' EXIT
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_root}?per_page=20&key=${key_prefix}" \
            > "${response_path}"
          echo "worker baseline cache candidate query prefix=${key_prefix} current_ref=${GITHUB_REF}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache candidate_count=$(jq '.actions_caches | length' "${response_path}")" | tee -a "${worker_cache_log_path}"
          jq -r '
            .actions_caches[]? |
            "worker baseline cache candidate key=\(.key) ref=\(.ref) version=\(.version) created_at=\(.created_at) last_accessed_at=\(.last_accessed_at) size_in_bytes=\(.size_in_bytes)"
          ' "${response_path}" | tee -a "${worker_cache_log_path}"
          ./src/pipeline_run.py inspect-cache-lifecycle \
            --scope worker \
            --cache-hit "${cache_hit}" \
            --candidate-response "${response_path}" \
            --cache-path .workflow_state/runtime/cache/check-cache.sqlite3 \
            --wal-path .workflow_state/runtime/cache/check-cache.sqlite3-wal \
            --shm-path .workflow_state/runtime/cache/check-cache.sqlite3-shm \
            | tee -a "${worker_cache_log_path}"
      - name: Download combined worker input artifact
        id: download_worker_input
        uses: actions/download-artifact@v8
        with:
          name: workflow-internal-combined-worker-inputs-${{ needs.prepare_run.outputs.batch_id }}
          path: .tmp/combined-worker-inputs
      - name: Restore worker input state
        id: restore_worker_input
        run: |
          set -eo pipefail
          ./src/pipeline_run.py handoff-restore \
            --state-root . --handoff prepare-worker \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" --config-name "${{ inputs.config_name }}" \
            --archive ".tmp/combined-worker-inputs/${{ matrix.worker_id }}"
      - name: Initialize worker statuses
        id: init
        continue-on-error: true
        run: |
          set -eo pipefail
          # Empty root assignments still have a worker manifest and complete
          # the same status and aggregate handoff lifecycle.
          init_status=0
          ./src/pipeline_run.py initialize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            > init.json 2> init.stderr || init_status=$?
          cat init.json
          cat init.stderr >&2
          init_result_valid=false
          if [ -s init.json ] && jq -e 'type == "object" and (.conclusion == "success" or .conclusion == "failure")' init.json >/dev/null 2>> init.stderr; then
            init_result_valid=true
            conclusion="$(jq -r '.conclusion' init.json)"
            error_reason="$(jq -j 'if (.failure_reason | type) == "string" then .failure_reason else "" end' init.json | tr '\r\n' '  ')"
          else
            conclusion="failure"
            error_reason="worker status initialization failed before returning a valid result (exit status ${init_status})"
            init_detail="$( { tail -n 10 init.stderr; tail -n 10 init.json; } | tr '\r\n' ' ' )"
            if [ -n "${init_detail}" ]; then error_reason="${error_reason}: ${init_detail}"; fi
          fi
          status_recording_error=""
          if [ "${init_result_valid}" = true ]; then
            status_recording_error="$(jq -j '.status_recording_error // empty' init.json | tr '\r\n' '  ')"
          fi
          if [ -n "${status_recording_error}" ]; then
            error_reason="${error_reason}; additionally, failure status could not be recorded: ${status_recording_error}"
          fi
          echo "overall_conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          printf 'error_reason=%s\n' "$error_reason" >> "$GITHUB_OUTPUT"
          if [ "${init_status}" -ne 0 ]; then exit "${init_status}"; fi
      - name: Log runner public network addresses
        id: log_worker_network_addresses
        if: ${{ steps.init.outcome == 'success' && steps.init.outputs.overall_conclusion == 'success' }}
        run: |
          set -eo pipefail
          mkdir -p .tmp
          address_log_path=".tmp/runner-public-addresses.log"
          : > "${address_log_path}"

          capture_public_address() {
            label="$1"
            shift
            if address="$(curl "$@" -fsS --max-time 10)"; then
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ${label}=${address}" | tee -a "${address_log_path}"
            else
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ${label}=unavailable" | tee -a "${address_log_path}"
            fi
          }

          capture_public_address "ipv4" -4 "https://api.ipify.org"
          capture_public_address "ipv6" -6 "https://api6.ipify.org"
      - name: Process worker assignment
        id: process
        if: ${{ steps.init.outcome == 'success' && steps.init.outputs.overall_conclusion == 'success' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          # The prepare step emits root-atomic worker manifests. Matrix
          # max-parallel controls GitHub worker count. Runtime
          # stage_concurrency controls worker-local async consumers. Delegation
          # and enabled host-resolution can adapt independently; disabled
          # host-resolution starts no host-resolution consumers. Delegation
          # runs an NS query; SOA fallback is used for NS NXDOMAIN or
          # retry-exhausted NS outcomes, and NS NODATA is directly actionable.
          worker_status=0
          ./src/pipeline_run.py worker \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --log-level "${{ inputs.worker_log_level }}" \
            --max-runtime-seconds "${{ needs.prepare_run.outputs.worker_runtime_budget_seconds }}" \
            > worker.json 2> worker.stderr || worker_status=$?
          cat worker.json
          cat worker.stderr >&2
          if [ -s worker.json ] && jq -e 'type == "object" and (.overall_conclusion == "success" or .overall_conclusion == "failure")' worker.json >/dev/null; then
            echo "overall_conclusion=$(jq -r '.overall_conclusion' worker.json)" >> "$GITHUB_OUTPUT"
            error_reason="$(jq -j '[.error_reason, (if (.status_recording_error | type) == "string" and .status_recording_error != "" then "failure status could not be recorded: " + .status_recording_error else empty end)] | map(select(type == "string" and length > 0)) | join("; " )' worker.json | tr '\r\n' '  ')"
            if [ "${worker_status}" -ne 0 ] && [ -z "${error_reason}" ]; then
              worker_detail="$(tail -n 10 worker.stderr | tr '\r\n' '  ')"
              error_reason="worker command failed (exit status ${worker_status})${worker_detail:+: ${worker_detail}}"
            fi
          else
            worker_exit_status="$worker_status"
            if [ "${worker_exit_status}" -eq 0 ]; then worker_exit_status=1; fi
            worker_status=1
            echo "overall_conclusion=failure" >> "$GITHUB_OUTPUT"
            error_reason="worker command failed before returning a valid result (exit status ${worker_exit_status})"
            worker_detail="$( { tail -n 10 worker.stderr; tail -n 10 worker.json; } | tr '\r\n' ' ' )"
            if [ -n "${worker_detail}" ]; then error_reason="${error_reason}: ${worker_detail}"; fi
          fi
          printf 'error_reason=%s\n' "$error_reason" >> "$GITHUB_OUTPUT"
          if [ "$worker_status" -ne 0 ]; then exit "$worker_status"; fi
      - name: Append runner public network addresses to worker log
        id: append_worker_network_addresses
        if: ${{ always() && steps.init.outcome == 'success' }}
        run: |
          set -eo pipefail
          worker_log_path="$(./src/pipeline_run.py handoff-worker-diagnostic-path --state-root . --batch-id "${{ needs.prepare_run.outputs.batch_id }}" --worker-id "${{ matrix.worker_id }}" --kind worker-log)"
          mkdir -p "$(dirname "${worker_log_path}")"
          {
            echo "=== Runner public network addresses ==="
            if [ -f ".tmp/runner-public-addresses.log" ]; then
              cat ".tmp/runner-public-addresses.log"
            else
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ipv4=unavailable"
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ipv6=unavailable"
            fi
          } >> "${worker_log_path}"
      - name: Finalize worker aggregate handoff
        id: finalize_handoff
        if: ${{ always() && steps.init.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          handoff_status=0
          ./src/pipeline_run.py finalize-worker-aggregate-handoff \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            > worker-handoff.json 2> worker-handoff.stderr || handoff_status=$?
          cat worker-handoff.json
          cat worker-handoff.stderr >&2
          if [ -s worker-handoff.json ] && jq -e 'type == "object" and (.handoff_finalized == true or .handoff_finalized == false)' worker-handoff.json >/dev/null; then
            echo "handoff_finalized=$(jq -r '.handoff_finalized' worker-handoff.json)" >> "$GITHUB_OUTPUT"
            error_reason="$(jq -j '[.error_reason, (if (.status_recording_error | type) == "string" and .status_recording_error != "" then "failure status could not be recorded: " + .status_recording_error else empty end)] | map(select(type == "string" and length > 0)) | join("; ")' worker-handoff.json | tr '\r\n' '  ')"
            if [ "${handoff_status}" -ne 0 ] && [ -z "${error_reason}" ]; then
              handoff_detail="$(tail -n 10 worker-handoff.stderr | tr '\r\n' '  ')"
              error_reason="worker handoff finalization failed (exit status ${handoff_status})${handoff_detail:+: ${handoff_detail}}"
            fi
          else
            handoff_exit_status="$handoff_status"
            if [ "${handoff_exit_status}" -eq 0 ]; then handoff_exit_status=1; fi
            handoff_status=1
            echo "handoff_finalized=false" >> "$GITHUB_OUTPUT"
            error_reason="worker handoff finalization failed before returning a valid result (exit status ${handoff_exit_status})"
            handoff_detail="$( { tail -n 10 worker-handoff.stderr; tail -n 10 worker-handoff.json; } | tr '\r\n' ' ' )"
            if [ -n "${handoff_detail}" ]; then error_reason="${error_reason}: ${handoff_detail}"; fi
          fi
          printf 'error_reason=%s\n' "$error_reason" >> "$GITHUB_OUTPUT"
          if [ "$handoff_status" -ne 0 ]; then exit "$handoff_status"; fi
      - name: Finalize successful worker statuses
        id: finalize_success
        if: ${{ always() && steps.init.outcome == 'success' && steps.init.outputs.overall_conclusion == 'success' && steps.process.outputs.overall_conclusion == 'success' && steps.process.outcome == 'success' && steps.finalize_handoff.outputs.handoff_finalized == 'true' && steps.finalize_handoff.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          finalize_status=0
          ./src/pipeline_run.py finalize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --output-commit-sha "" \
            --push-retry-count 0 \
            --fallback-conclusion success \
            2>&1 | tee status-finalization.log || finalize_status=$?
          if [ "${finalize_status}" -ne 0 ]; then
            detail="$(tail -n 1 status-finalization.log | tr '\r\n' '  ')"
            error_reason="worker success-status finalization failed (exit status ${finalize_status})"
            if [ -n "${detail}" ]; then error_reason="${error_reason}: ${detail}"; fi
            printf 'error_reason=%s\n' "${error_reason}" >> "$GITHUB_OUTPUT"
            exit "${finalize_status}"
          fi
      - name: Finalize failure worker statuses
        id: finalize_failure
        if: ${{ always() && (steps.init.outcome != 'success' || steps.init.outputs.overall_conclusion != 'success' || steps.process.outputs.overall_conclusion != 'success' || steps.process.outcome != 'success' || steps.finalize_handoff.outputs.handoff_finalized != 'true' || steps.finalize_handoff.outcome != 'success' || steps.finalize_success.outcome != 'success') }}
        continue-on-error: true
        env:
          WORKER_FAILURE_REASON: ${{ steps.init.outputs.error_reason || steps.process.outputs.error_reason || steps.finalize_handoff.outputs.error_reason || steps.finalize_success.outputs.error_reason || (steps.process.outcome != 'success' && 'worker job failed before aggregate handoff was finalized') || 'worker handoff or status finalization failed' }}
        run: |
          set -eo pipefail
          finalize_status=0
          ./src/pipeline_run.py finalize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --output-commit-sha "" \
            --push-retry-count 0 \
            --fallback-conclusion failure \
            --fallback-failure-reason "$WORKER_FAILURE_REASON" \
            2>&1 | tee failure-status-finalization.log || finalize_status=$?
          if [ "${finalize_status}" -ne 0 ]; then
            detail="$(tail -n 1 failure-status-finalization.log | tr '\r\n' '  ')"
            error_reason="worker failure-status finalization failed (exit status ${finalize_status})"
            if [ -n "${detail}" ]; then error_reason="${error_reason}: ${detail}"; fi
            printf 'error_reason=%s\n' "${error_reason}" >> "$GITHUB_OUTPUT"
            exit "${finalize_status}"
          fi
      - name: Stage worker artifact
        id: stage_worker_bundle
        if: ${{ always() && steps.init.outcome == 'success' }}
        run: |
          set -eo pipefail
          ./src/pipeline_run.py handoff-stage \
            --state-root . --handoff worker-aggregate \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --destination .tmp/worker_artifact_bundle
      - name: Upload worker bundle
        id: upload_worker_bundle
        if: ${{ always() && steps.stage_worker_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workflow-internal-worker-bundle-${{ needs.prepare_run.outputs.batch_id }}-${{ matrix.worker_id }}
          path: .tmp/worker_artifact_bundle
          include-hidden-files: true
          if-no-files-found: error
      - name: Record worker artifact receipt
        id: record_worker_artifact_receipt
        if: ${{ always() && steps.upload_worker_bundle.outcome == 'success' }}
        env:
          BATCH_ID: ${{ needs.prepare_run.outputs.batch_id }}
          WORKER_ID: ${{ matrix.worker_id }}
          ARTIFACT_ID: ${{ steps.upload_worker_bundle.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::worker artifact upload did not return a valid artifact ID"
            exit 1
          fi
          printf 'ARTIFACT_RECEIPT %s %s %s %s\n' "$GITHUB_RUN_ID" "$BATCH_ID" "$WORKER_ID" "$ARTIFACT_ID"
      - name: Fail worker when processing reported failure
        id: fail_worker
        if: ${{ always() }}
        env:
          WORKER_FAILURE_REASON: ${{ steps.init.outputs.error_reason || steps.process.outputs.error_reason || steps.finalize_handoff.outputs.error_reason || steps.finalize_success.outputs.error_reason || steps.finalize_failure.outputs.error_reason || 'worker stage failed; inspect the failed step logs for details' }}
          STATUS_FINALIZATION_ERROR: ${{ steps.finalize_failure.outputs.error_reason }}
          WORKER_ID: ${{ matrix.worker_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -eo pipefail
          failed_steps="$(jq -r 'to_entries | map(select(.value.outcome == "failure") | .key) | join(", ")' <<< "${STEPS_JSON}")"
          if [ -n "${failed_steps}" ] || [ "${{ steps.init.outputs.overall_conclusion }}" != "success" ] || [ "${{ steps.process.outputs.overall_conclusion }}" != "success" ] || [ "${{ steps.process.outcome }}" != "success" ] || [ "${{ steps.finalize_handoff.outputs.handoff_finalized }}" != "true" ] || [ "${{ steps.finalize_handoff.outcome }}" != "success" ] || [ "${{ steps.finalize_success.outcome }}" != "success" ] || [ "${{ steps.finalize_failure.outcome }}" = "failure" ] || [ "${{ steps.stage_worker_bundle.outcome }}" = "failure" ] || [ "${{ steps.upload_worker_bundle.outcome }}" = "failure" ] || [ "${{ steps.record_worker_artifact_receipt.outcome }}" = "failure" ]; then
            reason="${WORKER_FAILURE_REASON:-worker processing or handoff finalization failed}"
            if [ -n "${failed_steps}" ]; then reason="${reason}; failed worker step(s): ${failed_steps}"; fi
            if [ -n "${STATUS_FINALIZATION_ERROR}" ]; then
              reason="${reason}; additionally, ${STATUS_FINALIZATION_ERROR}"
            elif [ "${{ steps.finalize_failure.outcome }}" = "failure" ]; then
              reason="${reason}; worker failure-status finalization failed (see the preceding step log)"
            fi
            escaped_reason="${reason//%/%25}"
            escaped_reason="${escaped_reason//$'\r'/%0D}"
            escaped_reason="${escaped_reason//$'\n'/%0A}"
            echo "::error title=Worker ${WORKER_ID} failed::${escaped_reason}"
            echo "${WORKER_ID} failed: ${reason}"
            exit 1
          fi

  aggregate_and_publish:
    name: Aggregate and publish
    needs:
      - prepare_run
      - run_workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      PIPELINE_PUBLISH_TOKEN: ${{ secrets.PIPELINE_PUBLISH_TOKEN }}
      AGGREGATE_LOG_PATH: .debug_artifacts/runtime/logs/${{ inputs.config_name }}--aggregate.log
      CACHE_LOG_PATH: .debug_artifacts/runtime/logs/${{ inputs.config_name }}--cache.log
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set privileged remote when configured
        if: ${{ env.PIPELINE_PUBLISH_TOKEN != '' }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${PIPELINE_PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: src/pipeline_run.py
      - name: Prepare publish worktree
        run: |
          set -eo pipefail
          # This is a local temporary worktree path, not the Git branch name.
          ./src/pipeline_run.py prepare-publish-worktree \
            --source-root . \
            --state-root . \
            --target-branch "${{ needs.prepare_run.outputs.target_branch }}" \
            --base-ref "${{ needs.prepare_run.outputs.source_sha }}"
      # Keep aggregate reruns on the same DNS-only per-run cache lineage before
      # falling back to any newer config-wide cache generation. Restore output,
      # visible candidates, local DB file state, and sqlite usability are logged
      # as separate layers because candidate visibility is not restore
      # eligibility.
      - name: Restore aggregate baseline cache
        id: restore_aggregate_baseline_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-
            domain-pipeline-runtime-cache-${{ inputs.config_name }}-
      - name: Log aggregate baseline cache restore
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_hit="${{ steps.restore_aggregate_baseline_cache.outputs.cache-hit }}"
          if [ -z "${cache_hit}" ]; then
            restore_result="miss"
          elif [ "${cache_hit}" = "true" ]; then
            restore_result="exact"
          else
            restore_result="fallback"
          fi
          mkdir -p .workflow_state/runtime/cache
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          summary_parts=()
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "aggregate baseline cache restore config=${{ inputs.config_name }} run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache primary_key=domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restore_prefixes=domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-,domain-pipeline-runtime-cache-${{ inputs.config_name }}-" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache cache-hit=${cache_hit}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restore_result=${restore_result}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restored_paths=${summary}" | tee -a "${CACHE_LOG_PATH}"
          ls -la .workflow_state/runtime/cache | tee -a "${CACHE_LOG_PATH}"
      - name: Inspect aggregate cache candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_hit="${{ steps.restore_aggregate_baseline_cache.outputs.cache-hit }}"
          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/caches"
          key_prefix="domain-pipeline-runtime-cache-${{ inputs.config_name }}-"
          response_path="$(mktemp)"
          trap 'rm -f "${response_path}"' EXIT
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_root}?per_page=20&key=${key_prefix}" \
            > "${response_path}"
          echo "aggregate baseline cache candidate query prefix=${key_prefix} current_ref=${GITHUB_REF}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache candidate_count=$(jq '.actions_caches | length' "${response_path}")" | tee -a "${CACHE_LOG_PATH}"
          jq -r '
            .actions_caches[]? |
            "aggregate baseline cache candidate key=\(.key) ref=\(.ref) version=\(.version) created_at=\(.created_at) last_accessed_at=\(.last_accessed_at) size_in_bytes=\(.size_in_bytes)"
          ' "${response_path}" | tee -a "${CACHE_LOG_PATH}"
          ./src/pipeline_run.py inspect-cache-lifecycle \
            --scope aggregate \
            --cache-hit "${cache_hit}" \
            --candidate-response "${response_path}" \
            --cache-path .workflow_state/runtime/cache/check-cache.sqlite3 \
            --wal-path .workflow_state/runtime/cache/check-cache.sqlite3-wal \
            --shm-path .workflow_state/runtime/cache/check-cache.sqlite3-shm \
            | tee -a "${CACHE_LOG_PATH}"
      - name: Configure git actor
        run: |
          ./src/pipeline_run.py configure-git \
            --source-root . \
            --state-root .
      - name: Download prepared batch artifact
        uses: actions/download-artifact@v8
        with:
          name: workflow-internal-prepared-batch-${{ needs.prepare_run.outputs.batch_id }}
          path: .tmp/downloads/prepared
      - name: Select and download worker bundles
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_IDS_JSON: ${{ needs.prepare_run.outputs.worker_ids_json }}
        run: |
          uv run src/worker_artifact_correlation.py \
            --api-url "${{ github.api_url }}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-ids-json "$WORKER_IDS_JSON" \
            --destination .tmp/downloads
      - name: Restore prepared and worker state
        run: |
          set -eo pipefail
          batch_id="${{ needs.prepare_run.outputs.batch_id }}"
          ./src/pipeline_run.py handoff-restore --state-root . --handoff prepare-aggregate \
            --batch-id "$batch_id" --config-name "${{ inputs.config_name }}" --archive .tmp/downloads/prepared
          for worker_dir in ".tmp/downloads/workflow-internal-worker-bundle-${batch_id}-"*; do
            [ -d "${worker_dir}" ] || continue
            worker_id="${worker_dir##*/workflow-internal-worker-bundle-${batch_id}-}"
            ./src/pipeline_run.py handoff-restore --state-root . --handoff worker-aggregate \
              --batch-id "$batch_id" --worker-id "$worker_id" --archive "$worker_dir"
          done
      - name: Initialize aggregate job log
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          : > "${AGGREGATE_LOG_PATH}"
          {
            echo "aggregate job log initialized for config=${{ inputs.config_name }}"
            echo "batch_id=${{ needs.prepare_run.outputs.batch_id }}"
            echo "target_branch=${{ needs.prepare_run.outputs.target_branch }}"
          } | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Validate aggregate barrier
        id: readiness
        run: |
          set -eo pipefail
          {
            echo "=== Validate aggregate barrier ==="
            ./src/pipeline_run.py validate-aggregate \
              --source-root . \
              --state-root . \
              --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              | tee readiness.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "state=$(jq -r '.state' readiness.json)" >> "$GITHUB_OUTPUT"
      - name: Aggregate batch outputs
        if: ${{ steps.readiness.outputs.state == 'ready_success' || steps.readiness.outputs.state == 'ready_failed' }}
        run: |
          set -eo pipefail
          {
            echo "=== Aggregate batch outputs ==="
            ./src/pipeline_run.py aggregate \
              --source-root . \
              --state-root . \
              --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              | tee aggregate.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Export aggregate state
        if: ${{ steps.readiness.outputs.state == 'ready_success' || steps.readiness.outputs.state == 'ready_failed' }}
        id: aggregate_state
        run: |
          echo "state=$(jq -r '.state' aggregate.json)" >> "$GITHUB_OUTPUT"
      - name: Stage aggregate log artifact
        if: ${{ always() }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          : >> "${AGGREGATE_LOG_PATH}"
          : >> "${CACHE_LOG_PATH}"
          artifact_root=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}"
          copy_if_present() {
            source_path="$1"
            target_path="$2"
            if [ -f "${source_path}" ]; then
              cp "${source_path}" "${target_path}"
            else
              echo "aggregate artifact optional file missing: ${source_path}" | tee -a "${AGGREGATE_LOG_PATH}"
            fi
          }
          rm -rf .debug_artifacts/upload_bundle
          mkdir -p "${artifact_root}/validation-settings/logs"
          mkdir -p "${artifact_root}/prepared-batch/logs"
          mkdir -p "${artifact_root}/jsonl-log"
          mkdir -p "${artifact_root}/runtime-logs"
          mkdir -p "${artifact_root}/worker-logs"
          mkdir -p "${artifact_root}/cache-logs"
          if [ "${{ steps.aggregate_state.outputs.state }}" = "failed" ]; then
            failed_marker_path=".workflow_state/aggregate/${{ needs.prepare_run.outputs.batch_id }}/failed.json"
            mkdir -p "${artifact_root}/aggregate"
            cp "${failed_marker_path}" "${artifact_root}/aggregate/failed.json"
          fi
          for diagnostic in settings validation-log batch batch-log; do
            case "$diagnostic" in
              settings) target="${artifact_root}/validation-settings/logs/settings.json" ;;
              validation-log) target="${artifact_root}/validation-settings/logs/validate-settings.log" ;;
              batch) target="${artifact_root}/prepared-batch/logs/batch.json" ;;
              batch-log) target="${artifact_root}/prepared-batch/logs/prepare-batch.log" ;;
            esac
            ./src/pipeline_run.py handoff-export-diagnostic \
              --handoff prepare-aggregate --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --archive .tmp/downloads/prepared --kind "$diagnostic" --destination "$target"
          done
          copy_if_present \
            ".debug_artifacts/runtime/raw/${{ inputs.config_name }}.jsonl" \
            "${artifact_root}/jsonl-log/${{ inputs.config_name }}.jsonl"
          copy_if_present \
            ".debug_artifacts/runtime/logs/${{ inputs.config_name }}.log" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}.log"
          copy_if_present \
            ".debug_artifacts/runtime/logs/${{ inputs.config_name }}--aggregate.log" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          copy_if_present \
            "${CACHE_LOG_PATH}" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}--cache.log"
          for worker_dir in .tmp/downloads/workflow-internal-worker-bundle-${{ needs.prepare_run.outputs.batch_id }}-*; do
            [ -d "${worker_dir}" ] || continue
            artifact_name="${worker_dir##*/}"
            worker_id="${artifact_name#workflow-internal-worker-bundle-${{ needs.prepare_run.outputs.batch_id }}-}"
            ./src/pipeline_run.py handoff-export-diagnostic \
              --handoff worker-aggregate --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --worker-id "$worker_id" --archive "$worker_dir" --kind worker-log \
              --destination "${artifact_root}/worker-logs/${worker_id}.log"
            ./src/pipeline_run.py handoff-export-diagnostic \
              --handoff worker-aggregate --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --worker-id "$worker_id" --archive "$worker_dir" --kind cache-log \
              --destination "${artifact_root}/cache-logs/${worker_id}.log"
          done
          cp "${AGGREGATE_LOG_PATH}" "${artifact_root}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          cp "${CACHE_LOG_PATH}" "${artifact_root}/runtime-logs/${{ inputs.config_name }}--cache.log"
          echo "=== Aggregate artifact staging complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Inspect aggregate cache bundle
        id: inspect_aggregate_cache_bundle
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          should_save=false
          summary_parts=()
          # Save eligibility must inspect the full SQLite WAL bundle because
          # the main database alone is not a safe proxy for reusable state.
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              should_save=true
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "aggregate cache bundle summary=${summary} should_save=${should_save}" | tee -a "${CACHE_LOG_PATH}"
          echo "should_save=${should_save}" >> "$GITHUB_OUTPUT"
          echo "bundle_summary=${summary}" >> "$GITHUB_OUTPUT"
      - name: Log aggregate baseline cache save intent
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          echo "aggregate baseline cache save primary_key=domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache save should_save=${{ steps.inspect_aggregate_cache_bundle.outputs.should_save }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache save bundle_summary=${{ steps.inspect_aggregate_cache_bundle.outputs.bundle_summary }}" | tee -a "${CACHE_LOG_PATH}"
      - name: Save aggregate baseline cache
        if: ${{ (steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed') && steps.inspect_aggregate_cache_bundle.outputs.should_save == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate publish candidate sizes
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        run: |
          set -eo pipefail
          {
            echo "=== Validate publish candidate sizes ==="
            mapfile -t filtered_paths < <(
              jq -r '.final_output_paths.filtered[]?' aggregate.json
            )
            filtered_args=()
            for filtered_path in "${filtered_paths[@]}"; do
              filtered_args+=(--path "${filtered_path}")
            done
            ./src/pipeline_run.py validate-publish-candidate-sizes \
              --source-root . \
              --state-root . \
              --log-level "${{ inputs.aggregate_log_level }}" \
              "${filtered_args[@]}" \
              --path "$(jq -r '.final_output_paths.unactionable' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.review' aggregate.json)" \
              | tee publish-size-check.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "=== Publish-size validation complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Commit aggregate outputs
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        id: aggregate_commit
        run: |
          set -eo pipefail
          {
            echo "=== Commit aggregate outputs ==="
            mapfile -t filtered_paths < <(
              jq -r '.final_output_paths.filtered[]?' aggregate.json
            )
            filtered_args=()
            for filtered_path in "${filtered_paths[@]}"; do
              filtered_args+=(--path "${filtered_path}")
            done
            ./src/pipeline_run.py commit-paths \
              --source-root . \
              --state-root . \
              --message "pipeline-run(${{ needs.prepare_run.outputs.batch_id }}): aggregate outputs" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              "${filtered_args[@]}" \
              --path "$(jq -r '.final_output_paths.unactionable' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.review' aggregate.json)" \
              | tee aggregate-commit.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "commit_sha=$(jq -r '.commit_sha // empty' aggregate-commit.json)" >> "$GITHUB_OUTPUT"
          echo "=== Aggregate commit metadata captured ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Push published state
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        run: |
          set -eo pipefail
          {
            echo "=== Push published state ==="
            ./src/pipeline_run.py push-branch \
              --source-root . \
              --state-root . \
              --log-level "${{ inputs.aggregate_log_level }}" \
              --branch "${{ needs.prepare_run.outputs.target_branch }}" \
              --max-retries 2
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "=== Push published state complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Log aggregate artifact upload intent
        if: ${{ always() }}
        run: |
          set -eo pipefail
          echo "=== Upload aggregate log artifact ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Refresh staged aggregate job log
        if: ${{ always() }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          : >> "${AGGREGATE_LOG_PATH}"
          : >> "${CACHE_LOG_PATH}"
          # Refresh the staged artifact from the final aggregate log after the
          # later publish/upload-intent steps have appended to AGGREGATE_LOG_PATH.
          staged_aggregate_log_path=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          staged_cache_log_path=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}/runtime-logs/${{ inputs.config_name }}--cache.log"
          mkdir -p "$(dirname "${staged_aggregate_log_path}")"
          echo "refreshing staged aggregate job log source=${AGGREGATE_LOG_PATH} target=${staged_aggregate_log_path}" | tee -a "${AGGREGATE_LOG_PATH}"
          echo "refreshing staged cache lifecycle log source=${CACHE_LOG_PATH} target=${staged_cache_log_path}" | tee -a "${AGGREGATE_LOG_PATH}"
          cp "${AGGREGATE_LOG_PATH}" "${staged_aggregate_log_path}"
          cp "${CACHE_LOG_PATH}" "${staged_cache_log_path}"
      - name: Upload aggregate log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}
          path: .debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail failed aggregate runs
        if: ${{ steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          echo "aggregate marked batch ${{ needs.prepare_run.outputs.batch_id }} as failed"
          exit 1
      - name: Fail unexpected aggregate readiness
        if: ${{ steps.readiness.outputs.state != 'ready_success' && steps.readiness.outputs.state != 'ready_failed' }}
        run: |
          echo "unexpected aggregate readiness: ${{ steps.readiness.outputs.state }}"
          exit 1
