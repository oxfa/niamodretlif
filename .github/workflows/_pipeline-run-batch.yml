name: Trusted Pipeline Run Batch

on:
  workflow_call:
    inputs:
      config_name:
        required: true
        type: string
      config_path:
        required: true
        type: string
      worker_count:
        required: true
        type: number
      max_parallel_workers_default:
        required: false
        type: string
        default: ""
      worker_log_level:
        required: false
        type: string
        default: debug
      aggregate_log_level:
        required: false
        type: string
        default: debug

permissions: {}

env:
  PYTHONPATH: src

jobs:
  prepare_run:
    name: Validate settings and prepare batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      max_parallel_workers: ${{ steps.validate.outputs.max_parallel_workers }}
      worker_ids_json: ${{ steps.validate.outputs.worker_ids_json }}
      worker_runtime_budget_seconds: ${{ steps.validate.outputs.worker_runtime_budget_seconds }}
      target_branch: ${{ steps.validate.outputs.target_branch }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      batch_id: ${{ steps.batch.outputs.batch_id }}
    env:
      PIPELINE_RUN_MAX_PARALLEL_WORKERS: ${{ vars.PIPELINE_RUN_MAX_PARALLEL_WORKERS }}
      PIPELINE_PUBLISH_TARGET_BRANCH: ${{ vars.PIPELINE_PUBLISH_TARGET_BRANCH }}
      PIPELINE_MAX_RUNTIME_SECONDS: ${{ vars.PIPELINE_MAX_RUNTIME_SECONDS }}
      IP_LOCATION_IPINFO_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate settings
        id: validate
        run: |
          set -eo pipefail
          {
            echo "=== Validate settings ==="
            python -m domain_pipeline.pipeline_run validate-run-settings \
              --worker-count "${{ inputs.worker_count }}" \
              --max-parallel-workers "${PIPELINE_RUN_MAX_PARALLEL_WORKERS:-}" \
              --max-parallel-workers-default "${{ inputs.max_parallel_workers_default }}" \
              --worker-runtime-seconds "${PIPELINE_MAX_RUNTIME_SECONDS:-}" \
              | tee settings.json
          } 2>&1 | tee validate-settings.log
          echo "max_parallel_workers=$(jq -r '.max_parallel_workers' settings.json)" >> "$GITHUB_OUTPUT"
          echo "worker_ids_json=$(jq -c '.worker_ids' settings.json)" >> "$GITHUB_OUTPUT"
          echo "worker_runtime_budget_seconds=$(jq -r '.worker_runtime_budget_seconds' settings.json)" >> "$GITHUB_OUTPUT"
          # Default publishes go to main; the repository variable can override it.
          echo "target_branch=${PIPELINE_PUBLISH_TARGET_BRANCH:-main}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Stage validation artifact
        run: |
          set -eo pipefail
          mkdir -p .debug_artifacts/prepare/validation/logs
          cp settings.json .debug_artifacts/prepare/validation/logs/settings.json
          cp validate-settings.log .debug_artifacts/prepare/validation/logs/validate-settings.log
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-validation-settings
          path: .debug_artifacts/prepare/validation
          include-hidden-files: true
          if-no-files-found: error
      - name: Build committed batch state
        id: batch
        run: |
          set -eo pipefail
          {
            echo "=== Build committed batch state ==="
            python -m domain_pipeline.pipeline_run prepare-batch \
              --source-root . \
              --state-root . \
              --config "${{ inputs.config_path }}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --worker-count "${{ inputs.worker_count }}" \
              | tee batch.json
          } 2>&1 | tee prepare-batch.log
          echo "batch_id=$(jq -r '.batch_id' batch.json)" >> "$GITHUB_OUTPUT"
      - name: Stage prepared batch artifact
        run: |
          set -eo pipefail
          mkdir -p .tmp/prepared_batch/.workflow_state/batches
          cp -R \
            ".workflow_state/batches/${{ steps.batch.outputs.batch_id }}" \
            .tmp/prepared_batch/.workflow_state/batches/
      - name: Upload prepared batch artifact
        uses: actions/upload-artifact@v7
        with:
          name: workflow-internal-prepared-batch
          path: .tmp/prepared_batch
          include-hidden-files: true
          if-no-files-found: error
      - name: Stage prepared batch debug artifact
        run: |
          set -eo pipefail
          mkdir -p .debug_artifacts/prepare/batch/logs
          cp batch.json .debug_artifacts/prepare/batch/logs/batch.json
          cp prepare-batch.log .debug_artifacts/prepare/batch/logs/prepare-batch.log
      - name: Upload prepared batch debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-prepared-batch
          path: .debug_artifacts/prepare/batch
          include-hidden-files: true
          if-no-files-found: error

  run_workers:
    name: Run workers
    needs:
      - prepare_run
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare_run.outputs.max_parallel_workers) }}
      matrix:
        worker_id: ${{ fromJSON(needs.prepare_run.outputs.worker_ids_json) }}
    env:
      IP_LOCATION_IPINFO_TOKEN: ${{ secrets.IPINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Prefer the prior attempt from the same workflow run when a rerun needs
      # to resume DNS-only cache progress, then fall back to the broader
      # config-wide lineage. Later diagnostics log GitHub restore output,
      # visible cache candidates, local DB file state, and sqlite usability
      # separately; visible candidates do not prove restore eligibility.
      - name: Restore baseline cache
        id: restore_worker_baseline_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-
            domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-
      - name: Log worker baseline cache restore
        run: |
          set -eo pipefail
          worker_cache_log_path=".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/cache.log"
          mkdir -p "$(dirname "${worker_cache_log_path}")"
          cache_hit="${{ steps.restore_worker_baseline_cache.outputs.cache-hit }}"
          if [ -z "${cache_hit}" ]; then
            restore_result="miss"
          elif [ "${cache_hit}" = "true" ]; then
            restore_result="exact"
          else
            restore_result="fallback"
          fi
          mkdir -p .workflow_state/runtime/cache
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          summary_parts=()
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "worker baseline cache restore config=${{ inputs.config_name }} run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache primary_key=domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restore_prefixes=domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-,domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache cache-hit=${cache_hit}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restore_result=${restore_result}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache restored_paths=${summary}" | tee -a "${worker_cache_log_path}"
          ls -la .workflow_state/runtime/cache | tee -a "${worker_cache_log_path}"
      - name: Inspect worker cache candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          worker_cache_log_path=".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/cache.log"
          mkdir -p "$(dirname "${worker_cache_log_path}")"
          cache_hit="${{ steps.restore_worker_baseline_cache.outputs.cache-hit }}"
          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/caches"
          key_prefix="domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-"
          response_path="$(mktemp)"
          trap 'rm -f "${response_path}"' EXIT
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_root}?per_page=20&key=${key_prefix}" \
            > "${response_path}"
          echo "worker baseline cache candidate query prefix=${key_prefix} current_ref=${GITHUB_REF}" | tee -a "${worker_cache_log_path}"
          echo "worker baseline cache candidate_count=$(jq '.actions_caches | length' "${response_path}")" | tee -a "${worker_cache_log_path}"
          jq -r '
            .actions_caches[]? |
            "worker baseline cache candidate key=\(.key) ref=\(.ref) version=\(.version) created_at=\(.created_at) last_accessed_at=\(.last_accessed_at) size_in_bytes=\(.size_in_bytes)"
          ' "${response_path}" | tee -a "${worker_cache_log_path}"
          python -m domain_pipeline.pipeline_run inspect-cache-lifecycle \
            --scope worker \
            --cache-hit "${cache_hit}" \
            --candidate-response "${response_path}" \
            --cache-path .workflow_state/runtime/cache/check-cache.sqlite3 \
            --wal-path .workflow_state/runtime/cache/check-cache.sqlite3-wal \
            --shm-path .workflow_state/runtime/cache/check-cache.sqlite3-shm \
            | tee -a "${worker_cache_log_path}"
      - name: Download prepared batch artifact
        uses: actions/download-artifact@v8
        with:
          name: workflow-internal-prepared-batch
          path: .tmp/prepared_batch
      - name: Restore prepared batch state
        run: |
          set -eo pipefail
          mkdir -p .workflow_state
          cp -R .tmp/prepared_batch/.workflow_state/. .workflow_state/
      - name: Initialize worker statuses
        id: init
        run: |
          set -eo pipefail
          # Preparation may produce zero participating worker manifests when every
          # host becomes a preparation-owned terminal row, such as via
          # input/manual_filter_out/<config>.txt or public-suffix inputs.
          python -m domain_pipeline.pipeline_run initialize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            | tee init.json
          echo "participates=$(jq -r '.participates' init.json)" >> "$GITHUB_OUTPUT"
      - name: Log runner public network addresses
        if: ${{ steps.init.outputs.participates == 'true' }}
        run: |
          set -eo pipefail
          mkdir -p .tmp
          address_log_path=".tmp/runner-public-addresses.log"
          : > "${address_log_path}"

          capture_public_address() {
            label="$1"
            shift
            if address="$(curl "$@" -fsS --max-time 10)"; then
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ${label}=${address}" | tee -a "${address_log_path}"
            else
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ${label}=unavailable" | tee -a "${address_log_path}"
            fi
          }

          capture_public_address "ipv4" -4 "https://api.ipify.org"
          capture_public_address "ipv6" -6 "https://api6.ipify.org"
      - name: Process worker assignment
        id: process
        if: ${{ steps.init.outputs.participates == 'true' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          # The prepare step emits root-atomic worker manifests. Matrix
          # max-parallel controls GitHub worker count. Runtime
          # stage_concurrency controls worker-local async consumers. Delegation
          # and enabled host-resolution can adapt independently; disabled
          # host-resolution starts no host-resolution consumers. Delegation
          # runs an NS query; SOA fallback is used for NS NXDOMAIN or
          # retry-exhausted NS outcomes, and NS NODATA is directly actionable.
          python -m domain_pipeline.pipeline_run worker \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --log-level "${{ inputs.worker_log_level }}" \
            --max-runtime-seconds "${{ needs.prepare_run.outputs.worker_runtime_budget_seconds }}" \
            | tee worker.json
          echo "overall_conclusion=$(jq -r '.overall_conclusion' worker.json)" >> "$GITHUB_OUTPUT"
          echo "error_reason=$(jq -r '.error_reason // empty' worker.json)" >> "$GITHUB_OUTPUT"
      - name: Append runner public network addresses to worker log
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        run: |
          set -eo pipefail
          worker_log_path=".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/worker.log"
          mkdir -p "$(dirname "${worker_log_path}")"
          {
            echo "=== Runner public network addresses ==="
            if [ -f ".tmp/runner-public-addresses.log" ]; then
              cat ".tmp/runner-public-addresses.log"
            else
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ipv4=unavailable"
              echo "worker runner public address worker_id=${{ matrix.worker_id }} batch_id=${{ needs.prepare_run.outputs.batch_id }} ipv6=unavailable"
            fi
          } >> "${worker_log_path}"
      - name: Finalize worker aggregate handoff
        id: finalize_handoff
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          python -m domain_pipeline.pipeline_run finalize-worker-aggregate-handoff \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            | tee worker-handoff.json
          echo "error_reason=$(jq -r '.error_reason // empty' worker-handoff.json)" >> "$GITHUB_OUTPUT"
      - name: Finalize successful worker statuses
        if: ${{ steps.init.outputs.participates == 'true' && steps.process.outputs.overall_conclusion == 'success' && steps.finalize_handoff.outcome == 'success' }}
        run: |
          set -eo pipefail
          python -m domain_pipeline.pipeline_run finalize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --output-commit-sha "" \
            --push-retry-count 0
      - name: Finalize failure worker statuses
        if: ${{ steps.init.outputs.participates == 'true' && (steps.process.outputs.overall_conclusion != 'success' || steps.finalize_handoff.outcome != 'success') }}
        run: |
          set -eo pipefail
          python -m domain_pipeline.pipeline_run finalize-worker-statuses \
            --source-root . \
            --state-root . \
            --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
            --worker-id "${{ matrix.worker_id }}" \
            --output-commit-sha "" \
            --push-retry-count 0 \
            --fallback-conclusion failure \
            --fallback-failure-reason "${{ steps.process.outputs.error_reason || (steps.process.outcome != 'success' && 'worker job failed before aggregate handoff was finalized') || steps.finalize_handoff.outputs.error_reason || 'worker handoff finalization failed' }}"
      - name: Stage worker artifact
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        run: |
          set -eo pipefail
          rm -rf .tmp/worker_artifact_bundle
          worker_handoff_path=".workflow_state/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/worker-aggregate-manifest.json"
          if [ -f "${worker_handoff_path}" ]; then
            mkdir -p ".tmp/worker_artifact_bundle/.workflow_state/workers/${{ needs.prepare_run.outputs.batch_id }}"
            mkdir -p ".tmp/worker_artifact_bundle/.workflow_state/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}"
            cp \
              "${worker_handoff_path}" \
              ".tmp/worker_artifact_bundle/.workflow_state/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/worker-aggregate-manifest.json"
          fi
          if [ -f ".workflow_state/status/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}.json" ]; then
            mkdir -p ".tmp/worker_artifact_bundle/.workflow_state/status/${{ needs.prepare_run.outputs.batch_id }}"
            cp \
              ".workflow_state/status/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}.json" \
              ".tmp/worker_artifact_bundle/.workflow_state/status/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}.json"
          fi
      - name: Upload worker artifact
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: workflow-internal-worker-bundle-${{ matrix.worker_id }}
          path: .tmp/worker_artifact_bundle
          include-hidden-files: true
          if-no-files-found: error
      - name: Stage worker debug artifact
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        run: |
          set -eo pipefail
          rm -rf .tmp/worker_debug_bundle
          if [ -f ".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/worker.log" ]; then
            mkdir -p ".tmp/worker_debug_bundle/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs"
            cp \
              ".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/worker.log" \
              ".tmp/worker_debug_bundle/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/worker.log"
          fi
          if [ -f ".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/cache.log" ]; then
            mkdir -p ".tmp/worker_debug_bundle/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs"
            cp \
              ".debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/cache.log" \
              ".tmp/worker_debug_bundle/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${{ matrix.worker_id }}/logs/cache.log"
          fi
      - name: Upload worker debug artifact
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-worker-log-${{ matrix.worker_id }}
          path: .tmp/worker_debug_bundle
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail worker when processing reported failure
        if: ${{ always() && steps.init.outputs.participates == 'true' }}
        run: |
          set -eo pipefail
          if [ "${{ steps.process.outputs.overall_conclusion }}" != "success" ] || [ "${{ steps.finalize_handoff.outcome }}" != "success" ]; then
            echo "${{ matrix.worker_id }} reported terminal failure or handoff finalization failure"
            exit 1
          fi

  aggregate_and_publish:
    name: Aggregate and publish
    if: ${{ always() && needs.prepare_run.result == 'success' }}
    needs:
      - prepare_run
      - run_workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      PIPELINE_PUBLISH_TOKEN: ${{ secrets.PIPELINE_PUBLISH_TOKEN }}
      AGGREGATE_LOG_PATH: .debug_artifacts/runtime/logs/${{ inputs.config_name }}--aggregate.log
      CACHE_LOG_PATH: .debug_artifacts/runtime/logs/${{ inputs.config_name }}--cache.log
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set privileged remote when configured
        if: ${{ env.PIPELINE_PUBLISH_TOKEN != '' }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${PIPELINE_PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare publish worktree
        run: |
          set -eo pipefail
          # This is a local temporary worktree path, not the Git branch name.
          python -m domain_pipeline.pipeline_run prepare-publish-worktree \
            --source-root . \
            --state-root . \
            --target-branch "${{ needs.prepare_run.outputs.target_branch }}" \
            --base-ref "${{ needs.prepare_run.outputs.source_sha }}"
      # Keep aggregate reruns on the same DNS-only per-run cache lineage before
      # falling back to any newer config-wide cache generation. Restore output,
      # visible candidates, local DB file state, and sqlite usability are logged
      # as separate layers because candidate visibility is not restore
      # eligibility.
      - name: Restore aggregate baseline cache
        id: restore_aggregate_baseline_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-
            domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-
      - name: Log aggregate baseline cache restore
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_hit="${{ steps.restore_aggregate_baseline_cache.outputs.cache-hit }}"
          if [ -z "${cache_hit}" ]; then
            restore_result="miss"
          elif [ "${cache_hit}" = "true" ]; then
            restore_result="exact"
          else
            restore_result="fallback"
          fi
          mkdir -p .workflow_state/runtime/cache
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          summary_parts=()
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "aggregate baseline cache restore config=${{ inputs.config_name }} run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache primary_key=domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restore_prefixes=domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-,domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache cache-hit=${cache_hit}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restore_result=${restore_result}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache restored_paths=${summary}" | tee -a "${CACHE_LOG_PATH}"
          ls -la .workflow_state/runtime/cache | tee -a "${CACHE_LOG_PATH}"
      - name: Inspect aggregate cache candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_hit="${{ steps.restore_aggregate_baseline_cache.outputs.cache-hit }}"
          api_root="${{ github.api_url }}/repos/${GITHUB_REPOSITORY}/actions/caches"
          key_prefix="domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-"
          response_path="$(mktemp)"
          trap 'rm -f "${response_path}"' EXIT
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_root}?per_page=20&key=${key_prefix}" \
            > "${response_path}"
          echo "aggregate baseline cache candidate query prefix=${key_prefix} current_ref=${GITHUB_REF}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache candidate_count=$(jq '.actions_caches | length' "${response_path}")" | tee -a "${CACHE_LOG_PATH}"
          jq -r '
            .actions_caches[]? |
            "aggregate baseline cache candidate key=\(.key) ref=\(.ref) version=\(.version) created_at=\(.created_at) last_accessed_at=\(.last_accessed_at) size_in_bytes=\(.size_in_bytes)"
          ' "${response_path}" | tee -a "${CACHE_LOG_PATH}"
          python -m domain_pipeline.pipeline_run inspect-cache-lifecycle \
            --scope aggregate \
            --cache-hit "${cache_hit}" \
            --candidate-response "${response_path}" \
            --cache-path .workflow_state/runtime/cache/check-cache.sqlite3 \
            --wal-path .workflow_state/runtime/cache/check-cache.sqlite3-wal \
            --shm-path .workflow_state/runtime/cache/check-cache.sqlite3-shm \
            | tee -a "${CACHE_LOG_PATH}"
      - name: Configure git actor
        run: |
          python -m domain_pipeline.pipeline_run configure-git \
            --source-root . \
            --state-root .
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp/downloads
      - name: Restore prepared and worker state
        run: |
          set -eo pipefail
          mkdir -p .workflow_state
          cp -R \
            ".tmp/downloads/workflow-internal-prepared-batch/.workflow_state/." \
            .workflow_state/
          for worker_dir in .tmp/downloads/workflow-internal-worker-bundle-*; do
            [ -d "${worker_dir}" ] || continue
            if [ -d "${worker_dir}/.workflow_state/workers" ]; then
              mkdir -p .workflow_state/workers
              cp -R "${worker_dir}/.workflow_state/workers/." .workflow_state/workers/
            fi
            if [ -d "${worker_dir}/.workflow_state/status" ]; then
              mkdir -p .workflow_state/status
              cp -R "${worker_dir}/.workflow_state/status/." .workflow_state/status/
            fi
          done
      - name: Initialize aggregate job log
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          : > "${AGGREGATE_LOG_PATH}"
          {
            echo "aggregate job log initialized for config=${{ inputs.config_name }}"
            echo "batch_id=${{ needs.prepare_run.outputs.batch_id }}"
            echo "target_branch=${{ needs.prepare_run.outputs.target_branch }}"
          } | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Materialize incomplete worker statuses
        run: |
          set -eo pipefail
          {
            echo "=== Materialize incomplete worker statuses ==="
            python -m domain_pipeline.pipeline_run materialize-incomplete-statuses \
              --source-root . \
              --state-root . \
              --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --failure-reason "aggregate detected missing or incomplete worker artifacts" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              | tee materialize.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Validate aggregate barrier
        id: readiness
        run: |
          set -eo pipefail
          {
            echo "=== Validate aggregate barrier ==="
            python -m domain_pipeline.pipeline_run validate-aggregate \
              --source-root . \
              --state-root . \
              --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              | tee readiness.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "state=$(jq -r '.state' readiness.json)" >> "$GITHUB_OUTPUT"
      - name: Aggregate batch outputs
        if: ${{ steps.readiness.outputs.state == 'ready_success' || steps.readiness.outputs.state == 'ready_failed' }}
        run: |
          set -eo pipefail
          {
            echo "=== Aggregate batch outputs ==="
            python -m domain_pipeline.pipeline_run aggregate \
              --source-root . \
              --state-root . \
              --batch-id "${{ needs.prepare_run.outputs.batch_id }}" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              | tee aggregate.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Export aggregate state
        if: ${{ steps.readiness.outputs.state == 'ready_success' || steps.readiness.outputs.state == 'ready_failed' }}
        id: aggregate_state
        run: |
          echo "state=$(jq -r '.state' aggregate.json)" >> "$GITHUB_OUTPUT"
      - name: Stage aggregate log artifact
        if: ${{ always() }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          : >> "${AGGREGATE_LOG_PATH}"
          : >> "${CACHE_LOG_PATH}"
          artifact_root=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}"
          copy_if_present() {
            source_path="$1"
            target_path="$2"
            if [ -f "${source_path}" ]; then
              cp "${source_path}" "${target_path}"
            else
              echo "aggregate artifact optional file missing: ${source_path}" | tee -a "${AGGREGATE_LOG_PATH}"
            fi
          }
          rm -rf .debug_artifacts/upload_bundle
          mkdir -p "${artifact_root}/validation-settings/logs"
          mkdir -p "${artifact_root}/prepared-batch/logs"
          mkdir -p "${artifact_root}/jsonl-log"
          mkdir -p "${artifact_root}/runtime-logs"
          mkdir -p "${artifact_root}/worker-logs"
          mkdir -p "${artifact_root}/cache-logs"
          if [ "${{ steps.aggregate_state.outputs.state }}" = "failed" ]; then
            failed_marker_path=".workflow_state/aggregate/${{ needs.prepare_run.outputs.batch_id }}/failed.json"
            mkdir -p "${artifact_root}/aggregate"
            cp "${failed_marker_path}" "${artifact_root}/aggregate/failed.json"
          fi
          copy_if_present \
            .tmp/downloads/debug-validation-settings/logs/settings.json \
            "${artifact_root}/validation-settings/logs/settings.json"
          copy_if_present \
            .tmp/downloads/debug-validation-settings/logs/validate-settings.log \
            "${artifact_root}/validation-settings/logs/validate-settings.log"
          copy_if_present \
            .tmp/downloads/debug-prepared-batch/logs/batch.json \
            "${artifact_root}/prepared-batch/logs/batch.json"
          copy_if_present \
            .tmp/downloads/debug-prepared-batch/logs/prepare-batch.log \
            "${artifact_root}/prepared-batch/logs/prepare-batch.log"
          copy_if_present \
            ".debug_artifacts/runtime/raw/${{ inputs.config_name }}.jsonl" \
            "${artifact_root}/jsonl-log/${{ inputs.config_name }}.jsonl"
          copy_if_present \
            ".debug_artifacts/runtime/logs/${{ inputs.config_name }}.log" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}.log"
          copy_if_present \
            ".debug_artifacts/runtime/logs/${{ inputs.config_name }}--aggregate.log" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          copy_if_present \
            "${CACHE_LOG_PATH}" \
            "${artifact_root}/runtime-logs/${{ inputs.config_name }}--cache.log"
          for worker_dir in .tmp/downloads/debug-worker-log-*; do
            [ -d "${worker_dir}" ] || continue
            artifact_name="${worker_dir##*/}"
            worker_id="${artifact_name#debug-worker-log-}"
            worker_log_path="${worker_dir}/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${worker_id}/logs/worker.log"
            worker_cache_log_path="${worker_dir}/.debug_artifacts/workers/${{ needs.prepare_run.outputs.batch_id }}/${worker_id}/logs/cache.log"
            if [ -f "${worker_log_path}" ]; then
              cp "${worker_log_path}" "${artifact_root}/worker-logs/${worker_id}.log"
            fi
            if [ -f "${worker_cache_log_path}" ]; then
              cp "${worker_cache_log_path}" "${artifact_root}/cache-logs/${worker_id}.log"
            fi
          done
          cp "${AGGREGATE_LOG_PATH}" "${artifact_root}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          cp "${CACHE_LOG_PATH}" "${artifact_root}/runtime-logs/${{ inputs.config_name }}--cache.log"
          echo "=== Aggregate artifact staging complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Inspect aggregate cache bundle
        id: inspect_aggregate_cache_bundle
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          cache_paths=(
            ".workflow_state/runtime/cache/check-cache.sqlite3"
            ".workflow_state/runtime/cache/check-cache.sqlite3-wal"
            ".workflow_state/runtime/cache/check-cache.sqlite3-shm"
          )
          should_save=false
          summary_parts=()
          # Save eligibility must inspect the full SQLite WAL bundle because
          # the main database alone is not a safe proxy for reusable state.
          for cache_path in "${cache_paths[@]}"; do
            if [ -f "${cache_path}" ]; then
              should_save=true
              size_bytes="$(wc -c < "${cache_path}")"
              summary_parts+=("${cache_path}:present:${size_bytes}")
            else
              summary_parts+=("${cache_path}:missing:0")
            fi
          done
          summary="$(IFS=,; echo "${summary_parts[*]}")"
          echo "aggregate cache bundle summary=${summary} should_save=${should_save}" | tee -a "${CACHE_LOG_PATH}"
          echo "should_save=${should_save}" >> "$GITHUB_OUTPUT"
          echo "bundle_summary=${summary}" >> "$GITHUB_OUTPUT"
      - name: Log aggregate baseline cache save intent
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          echo "aggregate baseline cache save primary_key=domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache save should_save=${{ steps.inspect_aggregate_cache_bundle.outputs.should_save }}" | tee -a "${CACHE_LOG_PATH}"
          echo "aggregate baseline cache save bundle_summary=${{ steps.inspect_aggregate_cache_bundle.outputs.bundle_summary }}" | tee -a "${CACHE_LOG_PATH}"
      - name: Save aggregate baseline cache
        if: ${{ (steps.aggregate_state.outputs.state == 'aggregated' || steps.aggregate_state.outputs.state == 'failed') && steps.inspect_aggregate_cache_bundle.outputs.should_save == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .workflow_state/runtime/cache/check-cache.sqlite3
            .workflow_state/runtime/cache/check-cache.sqlite3-shm
            .workflow_state/runtime/cache/check-cache.sqlite3-wal
          key: domain-pipeline-runtime-cache-v3-${{ inputs.config_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate publish candidate sizes
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        run: |
          set -eo pipefail
          {
            echo "=== Validate publish candidate sizes ==="
            python -m domain_pipeline.pipeline_run validate-publish-candidate-sizes \
              --source-root . \
              --state-root . \
              --log-level "${{ inputs.aggregate_log_level }}" \
              --path "$(jq -r '.final_output_paths.filtered' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.unactionable' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.review' aggregate.json)" \
              | tee publish-size-check.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "=== Publish-size validation complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Commit aggregate outputs
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        id: aggregate_commit
        run: |
          set -eo pipefail
          {
            echo "=== Commit aggregate outputs ==="
            python -m domain_pipeline.pipeline_run commit-paths \
              --source-root . \
              --state-root . \
              --message "pipeline-run(${{ needs.prepare_run.outputs.batch_id }}): aggregate outputs" \
              --log-level "${{ inputs.aggregate_log_level }}" \
              --path "$(jq -r '.final_output_paths.filtered' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.unactionable' aggregate.json)" \
              --path "$(jq -r '.final_output_paths.review' aggregate.json)" \
              | tee aggregate-commit.json
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "commit_sha=$(jq -r '.commit_sha // empty' aggregate-commit.json)" >> "$GITHUB_OUTPUT"
          echo "=== Aggregate commit metadata captured ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Push published state
        if: ${{ steps.aggregate_state.outputs.state == 'aggregated' }}
        run: |
          set -eo pipefail
          {
            echo "=== Push published state ==="
            python -m domain_pipeline.pipeline_run push-branch \
              --source-root . \
              --state-root . \
              --log-level "${{ inputs.aggregate_log_level }}" \
              --branch "${{ needs.prepare_run.outputs.target_branch }}" \
              --max-retries 2
          } 2>&1 | tee -a "${AGGREGATE_LOG_PATH}"
          echo "=== Push published state complete ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Log aggregate artifact upload intent
        if: ${{ always() }}
        run: |
          set -eo pipefail
          echo "=== Upload aggregate log artifact ===" | tee -a "${AGGREGATE_LOG_PATH}"
      - name: Refresh staged aggregate job log
        if: ${{ always() }}
        run: |
          set -eo pipefail
          mkdir -p "$(dirname "${AGGREGATE_LOG_PATH}")"
          mkdir -p "$(dirname "${CACHE_LOG_PATH}")"
          : >> "${AGGREGATE_LOG_PATH}"
          : >> "${CACHE_LOG_PATH}"
          # Refresh the staged artifact from the final aggregate log after the
          # later publish/upload-intent steps have appended to AGGREGATE_LOG_PATH.
          staged_aggregate_log_path=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}/runtime-logs/${{ inputs.config_name }}--aggregate.log"
          staged_cache_log_path=".debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}/runtime-logs/${{ inputs.config_name }}--cache.log"
          mkdir -p "$(dirname "${staged_aggregate_log_path}")"
          echo "refreshing staged aggregate job log source=${AGGREGATE_LOG_PATH} target=${staged_aggregate_log_path}" | tee -a "${AGGREGATE_LOG_PATH}"
          echo "refreshing staged cache lifecycle log source=${CACHE_LOG_PATH} target=${staged_cache_log_path}" | tee -a "${AGGREGATE_LOG_PATH}"
          cp "${AGGREGATE_LOG_PATH}" "${staged_aggregate_log_path}"
          cp "${CACHE_LOG_PATH}" "${staged_cache_log_path}"
      - name: Upload aggregate log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}
          path: .debug_artifacts/upload_bundle/debug-pipeline-run-log-${{ inputs.config_name }}-${{ needs.prepare_run.outputs.batch_id }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail failed aggregate runs
        if: ${{ steps.aggregate_state.outputs.state == 'failed' }}
        run: |
          echo "aggregate marked batch ${{ needs.prepare_run.outputs.batch_id }} as failed"
          exit 1
      - name: Fail unexpected aggregate readiness
        if: ${{ steps.readiness.outputs.state != 'ready_success' && steps.readiness.outputs.state != 'ready_failed' }}
        run: |
          echo "unexpected aggregate readiness: ${{ steps.readiness.outputs.state }}"
          exit 1
