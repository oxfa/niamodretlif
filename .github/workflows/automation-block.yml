name: Automation Block
run-name: automation block / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: automation-block
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add still require delegation before filtered
# output; manual_filter_out bypasses DNS/geo and writes review rows.
jobs:
  batch:
    uses: ./.github/workflows/_automation-batch.yml
    with:
      config_name: block
      config_path: config/block.yaml
      # DNS query rate limits are enforced inside each worker process. Raising
      # worker_count still increases aggregate DNS QPS across GitHub runners.
      worker_count: 18
    secrets: inherit
