name: Pipeline Block
run-name: pipeline block / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-block
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add still require delegation before filtered
# output; manual_filter_out bypasses DNS/geo and writes review rows.
jobs:
  batch:
    uses: ./.github/workflows/_pipeline-run-batch.yml
    with:
      config_name: block
      config_path: config/block.yaml
      # Stage-specific resolver entries control live traffic share inside each
      # worker when weights are present. DNS query rate limits are enforced per
      # provider across the effective parallel workers. The repository variable
      # PIPELINE_RUN_MAX_PARALLEL_WORKERS overrides this config-specific default.
      worker_count: 18
      max_parallel_workers_default: "18"
    secrets: inherit
