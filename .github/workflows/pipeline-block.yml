name: Pipeline Block
run-name: pipeline block / ${{ github.run_id }}

on:
  workflow_run:
    workflows: ["Pipeline Direct"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pipeline-block
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config operator files:
# - input/manually_selected_for_filtered/block.txt
# - input/manually_excluded_from_sources/block.txt
# - input/manually_added/block.txt
# manually_selected_for_filtered and manually_added require actionable
# delegation before routing to filtered: NS records exist, NS NODATA, NS
# NXDOMAIN with same-owner SOA, or NS retry-exhausted with same-owner SOA.
# Source-matched public suffix selections route to filtered during prepare
# because there is no registrable domain to query. Unmatched selected entries
# route to review without DNS lookup; unmatched manually_added entries require
# all enabled sources to share dns_query/delegation/output behavior.
# manually_excluded_from_sources removes matching source domains before worker
# manifests and emits no output rows; non-matches are silent no-ops.
jobs:
  batch:
    uses: ./.github/workflows/_pipeline-run-batch.yml
    with:
      config_name: block
      config_path: config/block.yaml
      # Stage-specific resolver weights for enabled DNS stages control
      # first-attempt traffic share inside each worker. max_parallel_workers
      # controls only GitHub matrix concurrency. The repository variable
      # PIPELINE_RUN_MAX_PARALLEL_WORKERS overrides this config-specific default.
      worker_count: 18
      max_parallel_workers_default: "18"
    secrets: inherit
