name: Pipeline Block
run-name: pipeline block / ${{ github.run_id }}

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-block
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add require actionable delegation before
# routing to filtered: NS records exist, NS NODATA, NS NXDOMAIN with
# same-owner SOA, or NS retry-exhausted with same-owner SOA. Source-matched
# public suffix manual_filter_pass entries route to filtered during prepare
# because there is no registrable domain to query. Unmatched manual_filter_pass
# entries route to review without DNS lookup; unmatched manual_add entries
# require all enabled sources to share dns_query/delegation/output behavior.
# manual_filter_out is exact-host-only, bypasses delegation, host resolution,
# and IP-location, and routes to review.
jobs:
  batch:
    uses: ./.github/workflows/_pipeline-run-batch.yml
    with:
      config_name: block
      config_path: config/block.yaml
      # Stage-specific resolver weights for enabled DNS stages control
      # first-attempt traffic share inside each worker. max_parallel_workers
      # controls only GitHub matrix concurrency. The repository variable
      # PIPELINE_RUN_MAX_PARALLEL_WORKERS overrides this config-specific default.
      worker_count: 18
      max_parallel_workers_default: "18"
    secrets: inherit
