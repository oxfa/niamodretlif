version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/direct.txt
# - input/manual_filter_out/direct.txt
# - input/manual_add/direct.txt
# manual_filter_pass and manual_add entries still require DNS delegation. When
# delegation is actionable they bypass host-resolution and geo checks and emit
# filtered output. manual_add takes precedence over matching source entries for
# the same host. manual_filter_out skips DNS/geo and emits one review row per
# host. Public-suffix inputs are prepare-owned review/audit rows because they
# have no registrable domain for delegation.

defaults:
  fetch:
    request_timeout: 30.0

  dns:
    # ECS-enabled direct checks use Google Public DNS plus Quad9 ECS endpoints.
    # Worker-local query balancing and per-provider rate limits spread retries
    # across the pool, but total QPS still scales with workflow worker_count.
    nameservers:
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.11
      - 149.112.112.11
    timeout: 5.0
    ecs:
      enabled: true
      subnet: "140.206.64.0/24"
      scope_prefix_length: 0
    query_rate_limit:
      enabled: true
    query_balancer:
      enabled: true
      strategy: round_robin
    delegation:
      retry_attempts: 3
    host_resolution:
      enabled: true
      retry_attempts: 3

  output:
    directory: output

cache:
  classification_ttl_days:
    dns_delegation_actionable: 7
    dns_delegation_unactionable: 1
  dns_ttl_days: 7
  dns_host_resolution_ttl_days:
    resolved: 7
    nodata: 1
    nxdomain: 1
    unknown: 0

sources:
  - id: direct
    enabled: true
    input:
      type: url
      location: https://is.gd/43bKSw
    geo:
      enabled: true
      # Country-only ipinfo_lite lookups read GEO_IPINFO_TOKEN at runtime when
      # geo.token is blank. Provide it through workflow/env secrets, not config.
      provider: ipinfo_lite
      timeout: 5.0
      cache_ttl_days: 7
      policy:
        enabled: true
        match_scope: any_ip
        include:
          countries:
            - CN
