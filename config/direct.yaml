version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/direct.txt
# - input/manual_filter_out/direct.txt
# - input/manual_add/direct.txt
# manual_filter_pass and manual_add entries still require DNS delegation. When
# delegation is actionable they bypass host-resolution and geo checks and route
# to filtered. manual_add takes precedence over matching source entries for
# the same host. manual_filter_out skips delegation, host resolution, and geo
# and routes to review. Public-suffix inputs are prepare-owned
# review/audit rows because they have no registrable domain for delegation.

defaults:
  fetch:
    request_timeout: 30.0

  dns:
    # Delegation and host-resolution use separate resolver pools. Delegation
    # NS queries use the platform resolver plus Cloudflare Public DNS, Control D
    # unfiltered, and DNS.SB with ECS disabled. Resolver entries can omit
    # weight for stage-local traffic preference, not rate control. Per-provider
    # qps_per_worker values are worker-local project safety caps, not
    # provider-published guarantees.
    default_resolvers: []
    timeout: 15.0
    # Retryable DNS timeout/SERVFAIL waits use this exponential backoff base,
    # capped at 2 seconds between attempts.
    retry_backoff_base_seconds: 1.0
    query_rate_limit:
      enabled: true
      providers:
        system_resolver:
          qps_per_worker: 60.0
          burst: 10
          max_pending: 32
        google_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        quad9_ecs_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        cloudflare_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        opendns_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        controld_unfiltered_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        dns_sb_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        unrecognized_resolver:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
    delegation:
      resolvers:
        - resolver: system_resolver
          weight: 4
        - resolver: 1.1.1.1
          weight: 3
        # - resolver: 1.0.0.1
        #   weight: 3
        - resolver: 76.76.2.0
          weight: 2
        # - resolver: 76.76.10.0
        #   weight: 2
        - resolver: 185.222.222.222
          weight: 2
        # - resolver: 45.11.45.11
        #   weight: 2
      retry_attempts: 4
    host_resolution:
      enabled: true
      resolvers:
        - resolver: 8.8.8.8
        # - resolver: 8.8.4.4
        - resolver: 9.9.9.11
        # - resolver: 149.112.112.11
      ecs:
        enabled: true
        subnet: "140.206.64.0/24"
        scope_prefix_length: 0
      retry_attempts: 3

  output:
    directory: output

runtime:
  # Delegation concurrency is worker-local root-level NS lookup concurrency.
  # Host-resolution and geo concurrency remain host-level.
  stage_workers:
    delegation: 16
    host_resolution: 16
    geo: 8

cache:
  classification_ttl_days:
    dns_delegation_actionable: 7
    dns_delegation_unactionable: 1
  dns_ttl_days: 7
  dns_host_resolution_ttl_days:
    resolved: 7
    nodata: 1
    nxdomain: 1
    unknown: 0

sources:
  - id: direct
    enabled: true
    input:
      type: url
      location: https://is.gd/43bKSw
    geo:
      enabled: true
      # Country-only ipinfo_lite lookups read GEO_IPINFO_TOKEN at runtime when
      # geo.token is blank. Provide it through workflow/env secrets, not config.
      provider: ipinfo_lite
      timeout: 5.0
      cache_ttl_days: 7
      policy:
        enabled: true
        match_scope: any_ip
        include:
          countries:
            - CN
