version: 2

# Optional per-config operator files:
# - input/manually_selected_for_filtered/direct.txt
# - input/manually_excluded_from_sources/direct.txt
# - input/manually_added/direct.txt
# manually_selected_for_filtered and manually_added entries require actionable
# delegation when they have a registrable domain. Source-matched public suffix
# selections route to filtered during prepare because there is no registrable
# domain to query. Actionable delegation means NS records exist, NS returns
# NODATA, NS returns NXDOMAIN with same-owner SOA, or the NS retry budget is
# exhausted with same-owner SOA. NS NODATA does not require SOA fallback. When
# delegation is actionable, selected and added entries bypass host-resolution
# and IP-location checks and route to filtered. manually_added takes precedence
# over matching source entries for the same host. Unmatched selected entries
# route to review without DNS lookup; unmatched manually_added entries require
# all enabled sources to share dns_query/delegation/output behavior.
# manually_excluded_from_sources is target-based source subtraction: source
# entries whose parsed normalized target matches an operator entry are removed
# before worker manifests, and non-matches are silent no-ops. Other
# public-suffix inputs are prepare-owned terminal rows.

defaults:
  fetch:
    request_timeout: 30.0

  dns_query:
    # Delegation and host-resolution use separate resolver pools. Delegation
    # starts with NS queries. Separate SOA fallback queries after NS NXDOMAIN
    # or NS retry exhaustion use the same pool with ECS disabled. SOA fallback
    # is not used for NS NODATA. SOA fallback stays in delegation because it
    # determines registrable-domain actionability, not host A/AAAA resolution.
    # The delegation pool uses the
    # platform resolver plus
    # Cloudflare Public DNS, Control D unfiltered, and DNS.SB.
    # Stage resolver entries can omit weight on every entry for equal
    # first-attempt share, or set weight on every entry for explicit stage-local
    # traffic preference. Weight is not rate control. Per-provider qps_per_worker
    # values are worker-local project safety caps, not provider-published
    # guarantees.
    default_resolvers: []
    timeout: 25.0
    # Retryable DNS timeout/SERVFAIL waits use this exponential backoff base,
    # capped at 2 seconds between attempts.
    retry_backoff_base_seconds: 1.0
    query_rate_limit:
      enabled: true
      providers:
        system_resolver:
          qps_per_worker: 60.0
          burst: 10
          max_pending: 32
        google_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        quad9_ecs_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        cloudflare_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        controld_unfiltered_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        dns_sb_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
  delegation:
    resolvers:
      - resolver: system_resolver
        weight: 4
      - resolver: 1.1.1.1
        weight: 3
      # - resolver: 1.0.0.1
      #   weight: 3
      - resolver: 76.76.2.0
        weight: 2
      # - resolver: 76.76.10.0
      #   weight: 2
      - resolver: 185.222.222.222
        weight: 2
      # - resolver: 45.11.45.11
      #   weight: 2
    retry_attempts: 4
  host_resolution:
    enabled: true
    # Host-resolution resolver entries accept the same all-or-none weight field
    # as delegation. Omitted weights mean equal first-attempt share for this
    # stage.
    resolvers:
      - resolver: 8.8.8.8
      # - resolver: 8.8.4.4
      - resolver: 9.9.9.11
      # - resolver: 149.112.112.11
    ecs:
      enabled: true
      subnet: "140.206.64.0/24"
      scope_prefix_length: 0
    retry_attempts: 3

  output:
    directory: output

runtime:
  # Worker-local async stage concurrency inside one GitHub matrix worker.
  # Delegation and enabled host-resolution stages can adapt between minimums
  # and caps. Scale-up requires backlog, sustained DNS/in-flight work, and
  # usable provider capacity; one pressured provider does not by itself block
  # the whole stage, but all-provider pressure blocks creation. Disabled
  # host-resolution starts no host-resolution consumers. IP-location uses
  # static worker-local consumers.
  # Workflow matrix concurrency is separate.
  stage_concurrency:
    minimums:
      delegation: 20
      host_resolution: 20
      ip_location: 8
    adaptive:
      enabled: true
      delegation_enabled: true
      host_resolution_enabled: true
      supervisor_interval_seconds: 1.0
      busy_scale_up_after_seconds: 5.0
      idle_scale_down_after_seconds: 5.0
      pressure_window_seconds: 5.0
      queue_pressure_ratio: 0.8
      max_concurrency_multiplier: 4
      scale_up_step: 1
      scale_down_step: 1

cache:
  delegation_ttl_days:
    # Actionable delegation results use this TTL: NS records exist, NS NODATA,
    # NS NXDOMAIN with same-owner SOA, and NS retry-exhausted with same-owner SOA.
    actionable: 7
    # Stable unactionable delegation uses this TTL: NS NXDOMAIN with SOA absent
    # and successful NS answers with no nameserver targets. Review delegation
    # outcomes are not cached.
    unactionable: 1
  host_resolution_ttl_days:
    resolved: 7
    nodata: 1
    nxdomain: 1

sources:
  - id: direct
    enabled: true
    input:
      type: url
      location: https://is.gd/43bKSw
    ip_location:
      enabled: true
      # GitHub Actions secret storage name: IPINFO_API_TOKEN.
      # Runtime reads IP_LOCATION_IPINFO_TOKEN for country-only ipinfo_lite lookups when
      # ip_location.token is blank. Provide it through workflow/env secrets,
      # not config. Prepare-batch exits if the required token is absent; worker
      # manifests are created only after one non-retried validation probe. That
      # probe fails prepare only on IPinfo HTTP 401/403 credential rejection.
      timeout: 5.0
      cache_ttl_days: 7
      policy:
        enabled: true
        match_scope: any_ip
        include:
          countries:
            - CN
