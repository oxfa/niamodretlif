version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add entries require DNS delegation when they
# have a registrable domain. Source-matched public suffix manual_filter_pass
# entries route to filtered during prepare because there is no registrable
# domain to query. Actionable delegation means NS records exist, or NS returns
# NODATA while same-owner SOA exists. When delegation is actionable they bypass
# host-resolution and geo checks and route to filtered. manual_add takes precedence over
# matching source entries for the same host. manual_filter_out skips
# delegation, host resolution, and geo and routes to review. Other
# public-suffix inputs are prepare-owned review/audit rows.

defaults:
  fetch:
    request_timeout: 30.0

  dns:
    # Delegation-only block checks use the platform resolver plus Cloudflare
    # Public DNS, Control D unfiltered, and DNS.SB with ECS disabled for NS
    # queries and SOA fallback after NS NODATA. Resolver weights are stage-local
    # traffic preference, not rate control. Per-provider
    # qps_per_worker values are worker-local project safety caps, not
    # provider-published guarantees.
    default_resolvers: []
    timeout: 25.0
    # Retryable DNS timeout/SERVFAIL waits use this exponential backoff base,
    # capped at 2 seconds between attempts.
    retry_backoff_base_seconds: 1.0
    query_rate_limit:
      enabled: true
      providers:
        system_resolver:
          qps_per_worker: 60.0
          burst: 10
          max_pending: 32
        google_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        quad9_ecs_public_dns:
          qps_per_worker: 30.0
          burst: 5
          max_pending: 16
        cloudflare_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        opendns_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        controld_unfiltered_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        dns_sb_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        unrecognized_resolver:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
    delegation:
      resolvers:
        - resolver: system_resolver
          weight: 4
        - resolver: 1.1.1.1
          weight: 3
        # - resolver: 1.0.0.1
        #   weight: 3
        - resolver: 76.76.2.0
          weight: 2
        # - resolver: 76.76.10.0
        #   weight: 2
        - resolver: 185.222.222.222
          weight: 2
        # - resolver: 45.11.45.11
        #   weight: 2
      retry_attempts: 4
    host_resolution:
      enabled: false
      retry_attempts: 3

  output:
    directory: output

runtime:
  # Worker-local async stage concurrency inside one GitHub matrix worker.
  # Delegation and host-resolution can adapt between minimums and caps; geo is
  # static in this runtime version. Workflow matrix concurrency is separate.
  stage_concurrency:
    minimums:
      delegation: 20
      host_resolution: 20
      geo: 8
    adaptive:
      enabled: true
      delegation_enabled: true
      host_resolution_enabled: true
      supervisor_interval_seconds: 1.0
      busy_scale_up_after_seconds: 5.0
      idle_scale_down_after_seconds: 5.0
      pressure_window_seconds: 5.0
      queue_pressure_ratio: 0.8
      max_concurrency_multiplier: 4
      scale_up_step: 1
      scale_down_step: 1

cache:
  classification_ttl_days:
    # NS-present and NS-NODATA with same-owner SOA use the actionable TTL.
    dns_delegation_actionable: 7
    # Stable unactionable delegation, including NS-NODATA with SOA absent.
    dns_delegation_unactionable: 1
  dns_ttl_days: 7
  dns_host_resolution_ttl_days:
    resolved: 7
    nodata: 1
    nxdomain: 1
    unknown: 0

sources:
  - id: block
    enabled: true
    input:
      type: url
      location: https://is.gd/vQFXgT
    geo:
      enabled: false
