version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add entries require actionable delegation when
# they have a registrable domain. Source-matched public suffix
# manual_filter_pass entries route to filtered during prepare because there is
# no registrable domain to query. Actionable delegation means NS records exist,
# or NS returns NODATA and the registrable domain is proven to have same-owner
# SOA, either from the original NS negative-response authority section or from a
# separate delegation SOA query. When delegation is actionable,
# manual_filter_pass and manual_add bypass host-resolution and IP-location
# checks and route to filtered. manual_add takes precedence over matching
# source entries for the same host. Unmatched manual_filter_pass entries route
# to review without DNS lookup; unmatched manual_add entries require all
# enabled sources to share delegation/output behavior. manual_filter_out is
# exact-host-only, skips delegation, host resolution, and IP-location, and
# routes to review. Other public-suffix inputs are prepare-owned terminal rows.

defaults:
  fetch:
    request_timeout: 30.0

  dns_query:
    # Delegation-only block checks use the platform resolver plus Cloudflare
    # Public DNS, Control D unfiltered, and DNS.SB with ECS disabled. Delegation
    # starts with NS queries and uses separate SOA fallback queries after
    # NS NODATA or retry-exhausted SERVFAIL. SOA fallback stays in delegation
    # because it determines registrable-domain actionability, not host A/AAAA
    # resolution. Stage
    # resolver entries can omit weight on every entry for equal first-attempt
    # share, or set weight on every entry for explicit stage-local traffic
    # preference. Weight is not rate control. Per-provider qps_per_worker values
    # are worker-local project safety caps, not provider-published guarantees.
    default_resolvers: []
    timeout: 25.0
    # Retryable DNS timeout/SERVFAIL waits use this exponential backoff base,
    # capped at 2 seconds between attempts.
    retry_backoff_base_seconds: 1.0
    query_rate_limit:
      enabled: true
      providers:
        system_resolver:
          qps_per_worker: 60.0
          burst: 10
          max_pending: 32
        cloudflare_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        controld_unfiltered_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
        dns_sb_public_dns:
          qps_per_worker: 12.0
          burst: 2
          max_pending: 8
  delegation:
    resolvers:
      - resolver: system_resolver
        weight: 4
      - resolver: 1.1.1.1
        weight: 3
      # - resolver: 1.0.0.1
      #   weight: 3
      - resolver: 76.76.2.0
        weight: 2
      # - resolver: 76.76.10.0
      #   weight: 2
      - resolver: 185.222.222.222
        weight: 2
      # - resolver: 45.11.45.11
      #   weight: 2
    retry_attempts: 4
  host_resolution:
    enabled: false

  output:
    directory: output

runtime:
  # Worker-local async stage concurrency inside one GitHub matrix worker.
  # Delegation and enabled host-resolution stages can adapt between minimums
  # and caps. Scale-up requires backlog, sustained DNS/in-flight work, and
  # usable provider capacity; one pressured provider does not by itself block
  # the whole stage, but all-provider pressure blocks creation. Disabled
  # host-resolution starts no host-resolution consumers. Ip location is static.
  # Workflow matrix concurrency is separate.
  stage_concurrency:
    minimums:
      delegation: 20
      host_resolution: 20
      ip_location: 8
    adaptive:
      enabled: true
      delegation_enabled: true
      host_resolution_enabled: true
      supervisor_interval_seconds: 1.0
      busy_scale_up_after_seconds: 5.0
      idle_scale_down_after_seconds: 5.0
      pressure_window_seconds: 5.0
      queue_pressure_ratio: 0.8
      max_concurrency_multiplier: 4
      scale_up_step: 1
      scale_down_step: 1

cache:
  classification_ttl_days:
    # NS-present and NS-NODATA with same-owner SOA use the actionable TTL.
    delegation_actionable: 7
    # Stable unactionable delegation, including explicitly checked NS-NODATA
    # with SOA absent.
    delegation_unactionable: 1

sources:
  - id: block
    enabled: true
    input:
      type: url
      location: https://is.gd/vQFXgT
    ip_location:
      enabled: false
