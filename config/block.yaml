version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add entries still require DNS delegation. When
# delegation is actionable they bypass host-resolution and geo checks and emit
# filtered output. manual_add takes precedence over matching source entries for
# the same host. manual_filter_out skips DNS/geo and emits one review row per
# host. Public-suffix inputs are prepare-owned review/audit rows because they
# have no registrable domain for delegation.

defaults:
  fetch:
    request_timeout: 30.0

  dns:
    # Delegation-only block checks use the platform resolver plus Cloudflare
    # Public DNS, Control D unfiltered, and DNS.SB with ECS disabled. Resolver
    # weights control traffic share, while per-provider rate limits cap
    # throughput inside the delegation pool. Cloudflare/Control D/DNS.SB
    # publish no numeric public per-client QPS ceiling, so each uses the
    # conservative project cap of 25 QPS per worker, burst 25, max_pending 50.
    default_resolvers: []
    timeout: 5.0
    query_rate_limit:
      enabled: true
    delegation:
      resolvers:
        - resolver: system_resolver
          weight: 4
        - resolver: 1.1.1.1
          weight: 3
        # - resolver: 1.0.0.1
        #   weight: 3
        - resolver: 76.76.2.0
          weight: 2
        # - resolver: 76.76.10.0
        #   weight: 2
        - resolver: 185.222.222.222
          weight: 2
        # - resolver: 45.11.45.11
        #   weight: 2
      retry_attempts: 3
    host_resolution:
      enabled: false
      retry_attempts: 3

  output:
    directory: output

cache:
  classification_ttl_days:
    dns_delegation_actionable: 7
    dns_delegation_unactionable: 1
  dns_ttl_days: 7
  dns_host_resolution_ttl_days:
    resolved: 7
    nodata: 1
    nxdomain: 1
    unknown: 0

sources:
  - id: block
    enabled: true
    input:
      type: url
      location: https://is.gd/vQFXgT
    geo:
      enabled: false
