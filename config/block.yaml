version: 2

# Optional per-config manual files:
# - input/manual_filter_pass/block.txt
# - input/manual_filter_out/block.txt
# - input/manual_add/block.txt
# manual_filter_pass and manual_add entries still require DNS delegation.
# manual_add takes precedence over matching source entries for the same host.
# When delegation is actionable they bypass host-resolution and geo checks and
# emit filtered output. manual_filter_out skips DNS/geo and emits one review
# row per host. Public-suffix inputs are prepare-owned review/audit rows.

defaults:
  fetch:
    request_timeout: 30.0

  dns:
    nameservers: []
    timeout: 5.0
    ecs:
      enabled: false
      subnet: ""
      scope_prefix_length: 0
    delegation:
      retry_attempts: 3
    host_resolution:
      enabled: false
      retry_attempts: 3

  output:
    directory: output

cache:
  classification_ttl_days:
    dns_delegation_actionable: 7
    dns_delegation_unactionable: 1
  dns_ttl_days: 7

sources:
  - id: block
    enabled: true
    input:
      type: url
      location: https://is.gd/vQFXgT
    geo:
      enabled: false
